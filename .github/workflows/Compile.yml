name: Compile solution

on:
  push:
    branches:
      - '*'
  pull_request:

jobs:
  windows:
    name: windows-2025
    runs-on: windows-2025
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Test settings persistence
        run: dotnet run --project tests/NGraph.Settings.Tests -c Release

      - name: Test HOVS import and storage
        run: dotnet run --project tests/NGraph.Hovs.Tests -c Release

      - name: Compile solution
        run: dotnet run -c Release
        working-directory: "build"
        env:
          # PR builds validate the synthetic merge; release numbering is resolved only for real branches.
          Build__Version: ${{ github.event_name == 'pull_request' && format('0.0.0-pr.{0}', github.event.number) || '' }}
          DOTNET_ENVIRONMENT: ${{ github.ref_name == github.event.repository.default_branch && 'Production' || 'Development' }}